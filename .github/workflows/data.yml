name: Schiffsdaten aktualisieren

on:
  schedule:
    - cron: "17 4 * * 1"   # montags 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0
      - name: Schiffe aus der Wargaming-Enzyklopädie
        env:
          WG_APPLICATION_ID: ${{ secrets.WG_APPLICATION_ID }}
        run: node scripts/build-data.mjs
      - name: Neue Icons
        run: python3 -I scripts/icons.py
      - name: Daten prüfen
        run: node --test tests/unit/*.test.mjs
      - name: Änderungen committen
        run: |
          # Inhaltlich gleich (nur das Abrufdatum neu) und keine neuen Icons: nichts committen
          same=$(node -e 'const a=JSON.parse(require("child_process").execSync("git show HEAD:web/data/ships.json"));const b=require("./data/ships.json");delete a.fetched;delete b.fetched;console.log(JSON.stringify(a)===JSON.stringify(b))')
          if [ "$same" = "true" ] && [ -z "$(git status --porcelain -- assets/img data/icon-urls.json)" ]; then
            echo "Keine inhaltliche Änderung"; git checkout -- data; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/img/ships
          git commit -m "Schiffsdaten aktualisiert ($(node -p 'require("./data/ships.json").version'))"
          git push
