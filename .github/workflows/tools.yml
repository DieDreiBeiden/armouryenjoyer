name: Werkzeuge testen

on:
  push:
    branches: [main]
    paths: ["tools/**", ".github/workflows/tools.yml"]
  pull_request:
    paths: ["tools/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: wows_gp
        working-directory: tools/wows_gp
        run: python -m unittest -v test_wows_gp
